# Workflow riutilizzabile: costruisce un'immagine e la pubblica su ghcr.io.
# Lo chiamano i repo delle immagini da .github/workflows/release.yml su push di un tag vX.Y.Z.
name: docker-build
on:
  workflow_call:
    inputs:
      image_name:
        description: Nome dell'immagine, senza registry e senza owner (es. dns-checker)
        type: string
        required: true
      dockerfile:
        description: Percorso del Dockerfile
        type: string
        default: Dockerfile
      context:
        description: Contesto di build
        type: string
        default: .
    outputs:
      version:
        description: Versione pubblicata (X.Y.Z)
        value: ${{ jobs.build.outputs.version }}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Il tag deve essere vX.Y.Z
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' non valido: serve vX.Y.Z"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Riepilogo
        run: |
          {
            echo "### Immagine pubblicata"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Se è la prima release, controlla che il pacchetto sia pubblico: https://github.com/${{ github.repository_owner }}?tab=packages"
          } >> "$GITHUB_STEP_SUMMARY"
